<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점 연결 숫자 퍼즐</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#222b3a;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:16px}#slither-photo-26{max-width:660px;margin:0 auto}#slither-photo-26 .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 13px}#slither-photo-26 h1{font-size:21px;line-height:1.4;margin:0 0 5px}#slither-photo-26 .sub{font-size:13px;color:#64748b;line-height:1.5;margin:0}#slither-photo-26 .stat{border-radius:22px;background:#eaf0f8;color:#29405f;padding:9px 12px;font-size:13px;font-weight:700}#slither-photo-26 .board{background:#fff;border:1px solid #dde3ec;padding:7px;border-radius:16px;max-width:580px;margin:0 auto}#slither-photo-26 svg{width:100%;height:auto;display:block;background:#fcfbf8;border-radius:10px;touch-action:none}#slither-photo-26 .actions{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 10px}#slither-photo-26 button{min-height:44px;border-radius:11px;padding:10px 14px;border:1px solid #cbd5e1;background:#fff;color:#24324c;font:inherit;font-size:14px;font-weight:600;cursor:pointer}#slither-photo-26 button.primary{border-color:#293a59;background:#293a59;color:#fff}#slither-photo-26 button:focus-visible{outline:3px solid #6a8bd6;outline-offset:2px}#slither-photo-26 .message{border-radius:12px;background:#eef3f9;padding:12px 14px;font-size:14px;line-height:1.5;min-height:45px}#slither-photo-26 .message.good{background:#e8f5ee;color:#166534}#slither-photo-26 .message.bad{background:#fff0ec;color:#a02e22}#slither-photo-26 details{margin-top:12px;font-size:13px;color:#52627a;line-height:1.7}#slither-photo-26 summary{cursor:pointer;font-weight:700;color:#334155;padding:8px 0}
</style></head><body>
<div id='slither-photo-26'>
  <div class='top'><div><h1>점 연결 숫자 퍼즐</h1><p class='sub'>사진 속 10×10 퍼즐 · 슬리더링크</p></div><div class='stat' data-stat aria-live='polite'>숫자 불러오는 중…</div></div>
  <div class='board'><svg data-board viewBox='0 0 444 444' aria-label='10행 10열 점 연결 퍼즐판. 두 점을 선택하거나 점 사이를 터치하세요.' role='group'><text x='222' y='222' text-anchor='middle' fill='#64748b'>퍼즐 준비 중…</text></svg></div>
  <div class='actions'><button type='button' data-undo>↶ 한 수 취소</button><button type='button' data-reset>⟲ 처음부터</button><button type='button' class='primary' data-check>✓ 완성 확인</button></div>
  <div class='message' data-message aria-live='polite'>서로 이웃한 점 두 개를 차례로 누르거나, 점 사이의 선을 터치하세요. 손가락으로 점을 이어도 됩니다.</div>
  <details><summary>게임 규칙 보기</summary>숫자는 그 칸의 네 변 중 선이 지나가는 변의 개수입니다. 0인 칸 주변에는 선을 그리면 안 됩니다. 모든 숫자를 만족하면서 선이 끊기거나 갈라지지 않는 <strong>하나의 닫힌 고리</strong>를 만드세요. 초록색 숫자는 조건 충족, 빨간색 숫자는 선이 너무 많다는 뜻입니다.</details>
</div>
<script>
(() => {
 const root = document.getElementById('slither-photo-26');
 if (!root || root.dataset.ready) return;
 root.dataset.ready='1';
 const grid = [
 [null,3,3,null,2,null,null,1,null,null],
 [1,null,null,null,1,null,null,2,null,null],
 [2,null,null,1,null,0,2,null,3,0],
 [null,2,1,null,null,null,null,2,null,null],
 [1,null,null,3,3,null,null,1,null,1],
 [2,null,0,null,null,1,2,null,null,3],
 [null,null,3,null,null,null,null,2,3,null],
 [2,2,null,2,1,null,1,null,null,1],
 [null,null,3,null,null,2,null,null,null,2],
 [null,null,1,null,null,1,null,3,3,null]
 ];
 const svg = root.querySelector('[data-board]'), stat=root.querySelector('[data-stat]'), message=root.querySelector('[data-message]');
 const drawn=new Set(), history=[];
 const total=grid.flat().filter(n=>n!==null).length;
 const NS='http://www.w3.org/2000/svg';
 const pos=(r,c)=>[22+40*c,22+40*r];
 let selected=null, active=null, finished=false;
 function element(tag, attrs){const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,String(v)));svg.appendChild(el);return el;}
 function edgesFor(r,c){return [`H:${r}:${c}`,`H:${r+1}:${c}`,`V:${r}:${c}`,`V:${r}:${c+1}`];}
 function countCell(r,c){return edgesFor(r,c).reduce((acc,key)=>acc+(drawn.has(key)?1:0),0);}
 function endpoints(k){const [type,rs,cs]=k.split(':');const r=+rs,c=+cs;return type==='H'?[r*11+c,r*11+c+1]:[r*11+c,(r+1)*11+c];}
 function keyBetween(a,b){if(a.r===b.r&&Math.abs(a.c-b.c)===1)return `H:${a.r}:${Math.min(a.c,b.c)}`;if(a.c===b.c&&Math.abs(a.r-b.r)===1)return `V:${Math.min(a.r,b.r)}:${a.c}`;return null;}
 function say(t,kind=''){message.textContent=t;message.className=`message ${kind}`;}
 function render(){
  svg.replaceChildren();
  element('rect',{x:2,y:2,width:440,height:440,rx:13,fill:'#fcfbf8'});
  for(let r=0;r<10;r++)for(let c=0;c<10;c++){
    const val=grid[r][c];if(val===null)continue;
    const n=countCell(r,c), x=22+40*c+20,y=22+40*r+20;
    if(n>val)element('rect',{x:x-16,y:y-17,width:32,height:34,rx:8,fill:'#ffe2df'});
    else if(n===val&&val!==0)element('rect',{x:x-16,y:y-17,width:32,height:34,rx:8,fill:'#e1f4e9'});
    const t=element('text',{x,y:y+8,'text-anchor':'middle','font-family':'Georgia, serif','font-size':27,'font-weight':500,fill:n>val?'#b91c1c':(n===val&&val!==0)?'#166534':'#251e36','pointer-events':'none'});
    t.textContent=val;
  }
  const all=[];
  for(let r=0;r<=10;r++)for(let c=0;c<10;c++)all.push({k:`H:${r}:${c}`,r,c,vertical:false});
  for(let r=0;r<10;r++)for(let c=0;c<=10;c++)all.push({k:`V:${r}:${c}`,r,c,vertical:true});
  all.forEach(({k,r,c,vertical})=>{if(!drawn.has(k))return;const [x1,y1]=pos(r,c),[x2,y2]=vertical?pos(r+1,c):pos(r,c+1);element('line',{x1,y1,x2,y2,stroke:'#3d6da1','stroke-width':6.7,'stroke-linecap':'round','pointer-events':'none'});});
  all.forEach(({k,r,c,vertical})=>{const [x1,y1]=pos(r,c),[x2,y2]=vertical?pos(r+1,c):pos(r,c+1);element('line',{x1,y1,x2,y2,stroke:'transparent','stroke-width':18,'pointer-events':'stroke','data-edge':k});});
  for(let r=0;r<=10;r++)for(let c=0;c<=10;c++){
   const [cx,cy]=pos(r,c), chosen=selected&&selected.r===r&&selected.c===c;
   if(chosen)element('circle',{cx,cy,r:10,fill:'#d8eaff',stroke:'#3d6da1','stroke-width':2,'pointer-events':'none'});
   element('circle',{cx,cy,r:3.8,fill:'#3b2c52','pointer-events':'none'});
   element('circle',{cx,cy,r:11,fill:'transparent','data-dot':`${r}:${c}`});
  }
  let satisfied=0,tooMany=0;
  for(let r=0;r<10;r++)for(let c=0;c<10;c++){const n=grid[r][c];if(n!==null){const v=countCell(r,c);if(v===n)satisfied++;if(v>n)tooMany++;}}
  stat.textContent=`선 ${drawn.size}개 · 숫자 ${satisfied}/${total}`;
  if(tooMany)stat.setAttribute('title',`선이 너무 많은 칸 ${tooMany}개`);else stat.removeAttribute('title');
 }
 function change(k,onlyAdd=false){const was=drawn.has(k);if(onlyAdd&&was)return;was?drawn.delete(k):drawn.add(k);history.push({k,was});finished=false;render();}
 function closest(ev){const rect=svg.getBoundingClientRect();if(!rect.width||!rect.height)return null;const x=(ev.clientX-rect.left)*444/rect.width,y=(ev.clientY-rect.top)*444/rect.height;const c=Math.max(0,Math.min(10,Math.round((x-22)/40))),r=Math.max(0,Math.min(10,Math.round((y-22)/40)));const [cx,cy]=pos(r,c);return Math.hypot(cx-x,cy-y)<17?{r,c}:null;}
 function connectStraight(a,b){if(!a||!b)return false;let p={...a}, did=false;const dr=Math.sign(b.r-a.r),dc=Math.sign(b.c-a.c);if(a.r!==b.r&&a.c!==b.c)return false;let hops=0;while((p.r!==b.r||p.c!==b.c)&&hops++<10){const q={r:p.r+dr,c:p.c+dc},k=keyBetween(p,q);if(!k)break;change(k,true);did=true;p=q;}return did;}
 svg.addEventListener('pointerdown', ev=>{
  if(ev.pointerType==='mouse'&&ev.button!==0)return;
  const edge=ev.target.closest('[data-edge]');
  if(edge&&svg.contains(edge)){selected=null;active=null;change(edge.getAttribute('data-edge'));return;}
  const dot=closest(ev);
  if(!dot){selected=null;render();return;}
  if(selected){const k=keyBetween(selected,dot);if(k){selected=null;active=null;change(k);return;}}
  selected=dot;active={id:ev.pointerId,last:dot,changed:false};
  try{svg.setPointerCapture(ev.pointerId);}catch(e){}
  render();
 });
 svg.addEventListener('pointermove',ev=>{
  if(!active||active.id!==ev.pointerId)return;
  const dot=closest(ev);
  if(!dot||(dot.r===active.last.r&&dot.c===active.last.c))return;
  if(connectStraight(active.last,dot)){active.last=dot;active.changed=true;selected=null;}
 });
 function release(ev){if(active&&active.id===ev.pointerId)active=null;}
 svg.addEventListener('pointerup',release);svg.addEventListener('pointercancel',release);
 root.querySelector('[data-undo]').addEventListener('click',()=>{const h=history.pop();if(!h){say('되돌릴 선이 없습니다.');return;}h.was?drawn.add(h.k):drawn.delete(h.k);selected=null;finished=false;render();say('직전 선을 취소했습니다.');});
 root.querySelector('[data-reset]').addEventListener('click',()=>{drawn.clear();history.length=0;selected=null;active=null;finished=false;render();say('퍼즐을 초기화했습니다.');});
 root.querySelector('[data-check]').addEventListener('click',()=>{
  let under=0,over=0;
  for(let r=0;r<10;r++)for(let c=0;c<10;c++){const v=grid[r][c];if(v===null)continue;const n=countCell(r,c);if(n<v)under++;if(n>v)over++;}
  if(over){say(`숫자보다 선이 많은 칸이 ${over}개 있습니다. 빨간 숫자를 확인하세요.`,'bad');return;}
  if(under){say(`아직 선이 부족한 숫자 칸이 ${under}개 있습니다.`,'bad');return;}
  if(drawn.size===0){say('점을 연결해 하나의 고리를 만드세요.','bad');return;}
  const degree=new Map(),neighbors=new Map();
  drawn.forEach(k=>{const [a,b]=endpoints(k);degree.set(a,(degree.get(a)||0)+1);degree.set(b,(degree.get(b)||0)+1);if(!neighbors.has(a))neighbors.set(a,[]);if(!neighbors.has(b))neighbors.set(b,[]);neighbors.get(a).push(b);neighbors.get(b).push(a);});
  if([...degree.values()].some(n=>n!==2)){say('선이 끊겼거나 갈라진 점이 있습니다. 모든 사용한 점에는 선이 정확히 2개 연결되어야 합니다.','bad');return;}
  const start=degree.keys().next().value, visited=new Set([start]),todo=[start];
  while(todo.length){const node=todo.pop();for(const next of neighbors.get(node)||[]){if(!visited.has(next)){visited.add(next);todo.push(next);}}}
  if(visited.size!==degree.size){say('고리가 여러 개입니다. 하나의 고리로 이어야 합니다.','bad');return;}
  finished=true;say('🎉 정답입니다! 모든 숫자를 만족하는 하나의 닫힌 고리를 완성했습니다.','good');
 });
 render();
})();
</script></body></html>
